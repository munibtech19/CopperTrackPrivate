name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # manual trigger bhi allow karega

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew not found - will use gradle wrapper generation"
          fi

      - name: Create Gradle Wrapper (if missing)
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.5 || true
          fi
          chmod +x ./gradlew || true

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CopperTrack-Private-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
